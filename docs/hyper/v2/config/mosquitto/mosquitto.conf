# NOMAD Mosquitto MQTT Broker Config
persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# TCP listener
listener 1883 0.0.0.0

# WebSocket listener (для браузерных клиентов)
listener 9001 0.0.0.0
protocol websockets

# В LAN без аутентификации (включить для безопасной конфигурации)
allow_anonymous true

# Для включения auth:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# Создать: mosquitto_passwd -c /mosquitto/config/passwd nomad

# Лимиты
max_connections 100
max_queued_messages 1000
message_size_limit 262144
